<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>json-doc</title>
<style id="css">
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 760px; margin: auto; padding: 16px; }
  textarea { width: 100%; height: 60vh; box-sizing: border-box; }
  dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 16px; }
  dt { color: #777; font-size: 12px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  section { grid-column: 1 / -1; padding-left: 12px; border-left: 1px solid #ddd; }
  table { display: block; overflow-x: auto; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 2px 12px 2px 0; border-bottom: 1px solid #eee; }
  tr { break-inside: avoid; }
  .ok, .warn, .bad { padding: 8px 12px; border-radius: 6px; font-weight: bold; print-color-adjust: exact; }
  .ok { background: #e6f4ea; color: #137333; }
  .warn { background: #fef7e0; color: #8a5300; }
  .bad { background: #fce8e6; color: #c5221f; }
  small { display: block; font-weight: normal; color: #555; overflow-wrap: anywhere; }
</style>

<p><input type="file" id="file" accept=".json"> Choose a JSON file, drop it here, or paste it below.</p>
<textarea id="text"></textarea>
<p><button id="go">Open document</button> <span id="error"></span></p>

<h3>Sign this document</h3>
<p>Your domain <input id="domain" placeholder="example.com"> <button id="newToken">Create secret</button></p>
<p>Your secret <input id="token" type="password" autocomplete="off"></p>
<p><button id="sign">Sign</button></p>
<p id="signStatus"></p>
<p><a id="download" download="signed.json" hidden>Download signed document</a></p>
<small>Only your domain, your secret and a fingerprint of the document are sent to <span id="signServer"></span>. The document stays on your computer.</small>

<script>
  const [css, file, text, go, error, signServer, domain, token, newToken, sign, signStatus, download] =
    ['css', 'file', 'text', 'go', 'error', 'signServer', 'domain', 'token', 'newToken', 'sign', 'signStatus', 'download'].map(id => document.getElementById(id));
  const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
  const label = k => esc(k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const isPrim = v => v == null || typeof v !== 'object';
  // Signed file: { document, signature } at the top level, nothing else.
  const isSigned = v => isObj(v) && 'document' in v && Object.keys(v).every(k => k === 'document' || k === 'signature');

  function render(v) {
    if (isPrim(v)) return v == null ? '—' : esc(v);
    if (Array.isArray(v) && v.length && v.every(isObj)) {
      const keys = [...new Set(v.flatMap(Object.keys))];
      return '<table><tr>' + keys.map(k => `<th>${label(k)}</th>`).join('') + '</tr>' +
        v.map(o => '<tr>' + keys.map(k => `<td>${render(o[k])}</td>`).join('') + '</tr>').join('') + '</table>';
    }
    if (Array.isArray(v)) return '<ul>' + v.map(x => `<li>${render(x)}</li>`).join('') + '</ul>';
    return '<dl>' + Object.entries(v).map(([k, x]) => isPrim(x)
      ? `<div><dt>${label(k)}</dt><dd>${render(x)}</dd></div>`
      : `<section><strong>${label(k)}</strong>${render(x)}</section>`).join('') + '</dl>';
  }

  // Signing servers trusted to confirm who signed and when. Keys come from here, never from the file.
  // A leaked key gets an `until` time: later documents are rejected. Earlier ones still pass, but a leaked key
  // can also fake an earlier time, so only the server's log can tell those apart.
  const SERVERS = {
    'sign.json-doc.com': [{ publicKey: 'MCowBQYDK2VwAyEAJtOn+hyF5MNcKBnAW8Mr4y7VaQ210eO0J/w9igqNN8w=', until: null }],
  };
  // The signing server this page uses to sign.
  const SIGN_SERVER = 'https://sign.json-doc.com';

  // Canonical JSON (RFC 8785): keys sorted, no whitespace, so key order and formatting don't matter.
  const canonical = v => JSON.stringify(v, (_, x) => isObj(x) ? Object.fromEntries(Object.keys(x).sort().map(k => [k, x[k]])) : x);
  // Keys and signatures are decoded strictly: any edit to their base64 text (even padding) is rejected.
  const bytes = t => { const b = atob(t); if (btoa(b) !== t) throw Error('Invalid base64'); return Uint8Array.from(b, c => c.charCodeAt(0)); };
  const utf8 = s => new TextEncoder().encode(s);
  const sha256 = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', utf8(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const ed25519 = async (publicKey, value, data) =>
    crypto.subtle.verify('Ed25519', await crypto.subtle.importKey('spki', bytes(publicKey), 'Ed25519', false, ['verify']), bytes(value), data);

  // Returns [class, message] for the banner above a signed document.
  async function check({ document: doc, signature: s }) {
    try {
      // Server-signed: the server signed { domain, hash, server, time } with a key from SERVERS.
      if (s.server !== undefined) {
        const keys = Object.hasOwn(SERVERS, s.server) && SERVERS[s.server];
        if (!keys) return ['bad', `✗ Not signed by a trusted server<small>Server: ${esc(s.server)}</small>`];
        const payload = utf8(canonical({ domain: s.domain, hash: await sha256(canonical(doc)), server: s.server, time: s.time }));
        for (const k of keys) {
          if (k.until && !(new Date(s.time) < new Date(k.until))) continue;
          if (await ed25519(k.publicKey, s.value, payload))
            return ['ok', `✓ Signed by ${esc(s.domain)} · ${esc(s.time.slice(0, 16).replace('T', ' '))} UTC<small>Confirmed by ${esc(s.server)}</small>`];
        }
      // Self-signed: the key is in the file, so this proves the document is unchanged, not who signed it.
      } else if (await ed25519(s.publicKey, s.value, utf8(canonical(doc)))) {
        return ['warn', `⚠ Signer not confirmed<small>The document is unchanged since it was signed. Ask the signer if this key is theirs: ${esc(s.publicKey)}</small>`];
      }
    } catch {}
    return ['bad', '✗ Signature not valid'];
  }

  // Opens the document in a new tab, built locally in the browser.
  go.onclick = async () => {
    let data, status = '';
    try { data = JSON.parse(text.value); error.textContent = ''; } catch (e) { return error.textContent = 'This is not valid JSON: ' + e.message; }
    const w = window.open('');
    if (isSigned(data)) {
      const [cls, message] = await check(data);
      status = `<p class="${cls}">${message}</p>`;
      data = data.document;
    }
    w.document.write(`<!doctype html><meta charset="utf-8"><title>json-doc</title><style>${css.textContent}</style>${status}${render(data)}`);
    w.document.close();
  };

  // Signing: only the domain, the secret and the document's hash are sent to SIGN_SERVER.
  signServer.textContent = new URL(SIGN_SERVER).host;
  newToken.onclick = () => {
    token.type = 'text';
    token.value = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replace(/[+/=]/g, c => ({ '+': '-', '/': '_', '=': '' })[c]);
    signStatus.textContent = 'Save this secret somewhere safe. Anyone who has it can sign as your domain.';
  };
  sign.onclick = async () => {
    download.hidden = true;
    const name = domain.value.trim().toLowerCase();
    if (!/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(name)) return signStatus.textContent = 'Enter your domain, like example.com.';
    if (!token.value) return signStatus.textContent = 'Enter your secret, or click Create secret.';
    signStatus.textContent = 'Signing…';
    try {
      let doc;
      try { doc = JSON.parse(text.value); } catch (e) { throw Error('This is not valid JSON: ' + e.message); }
      if (isSigned(doc)) doc = doc.document;
      const res = await fetch(SIGN_SERVER + '/sign', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ domain: name, token: token.value, hash: await sha256(canonical(doc)) })
      });
      // 403: the domain's DNS doesn't list this secret yet. The record holds the secret's fingerprint, not the secret.
      if (res.status === 403) return signStatus.innerHTML = `To prove you own ${esc(name)}, add this record in your domain's DNS settings, then click Sign again.` +
        `<small>Type: TXT<br>Name: _json-doc.${esc(name)}<br>Value: ${await sha256(token.value)}</small>`;
      const body = await res.json().catch(() => ({ error: `Signing server error (${res.status})` }));
      if (!res.ok || body.error) throw Error(body.error);
      text.value = JSON.stringify({ document: doc, signature: body }, null, 2);
      download.href = URL.createObjectURL(new Blob([text.value], { type: 'application/json' }));
      download.hidden = false;
      signStatus.textContent = 'Signed. Click Open document to see it.';
    } catch (e) { signStatus.textContent = e.message; }
  };

  const load = f => f?.text().then(t => text.value = t);
  file.onchange = () => { load(file.files[0]); file.value = ''; };
  ondragover = e => e.preventDefault();
  ondrop = e => { e.preventDefault(); load(e.dataTransfer.files[0]); };
</script>
