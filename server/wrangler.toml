# Cloudflare Workers settings. Deploy with: npx wrangler deploy (from this folder)
name = "json-doc-sign"
main = "worker.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "sign.json-doc.com", custom_domain = true }]

[vars]
SERVER_NAME = "sign.json-doc.com"

# Keeps every signature. Created with `npx wrangler kv namespace create LOG`.
[[kv_namespaces]]
binding = "LOG"
id = "8628bee8033e424498e3a6253dfe0416"
